name: Dependency Update

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Check for outdated dependencies
        id: check
        run: |
          pnpm outdated --format json > outdated.json || true
          if [ -s outdated.json ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Update dependencies
        if: steps.check.outputs.has_updates == 'true'
        run: |
          pnpm update --latest --interactive false

      - name: Run tests
        if: steps.check.outputs.has_updates == 'true'
        run: |
          pnpm install
          pnpm test:run
        env:
          NODE_ENV: test

      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update dependencies'
          title: '🔄 Automated Dependency Update'
          body: |
            ## Automated Dependency Update

            This PR updates project dependencies to their latest versions.

            ### Changes
            - Updated dependencies via `pnpm update --latest`
            - All tests passing ✅

            ### Review Checklist
            - [ ] Check for breaking changes in changelog
            - [ ] Verify test coverage maintained
            - [ ] Review security advisories
            - [ ] Test application locally

            ---
            *Generated by [Dependency Update Workflow](https://github.com/${{ github.repository }}/actions/workflows/dependency-update.yml)*
          branch: chore/dependency-update
          delete-branch: true
          labels: dependencies,automated
